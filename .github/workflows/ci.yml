name: Vessel cross-platform checks
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      # Without this a failing target hides every later one, and the pty layer test
      # exists precisely to be read when the daemon test fails.
      - run: cargo test -p vessel-core --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p vessel --release
      - name: Real PTY browser integration (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build -p vessel-core
          npx playwright install chromium
          npm test
